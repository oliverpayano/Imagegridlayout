<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="image-grid">
        <img class="tall top-left" src="Luffy.png" alt="Monkey D Luffy">
        <img class="top-middle"src="Zoro.png" alt="Ronanoa Zoro">
        <img class="tall top-right" src="Nami.png" alt="Nami">
        <img class="bottom-left" src="Robin.png" alt="Nico Robin">
        <img class="tall middle" src="Chopper.png" alt="Tony Tony Chopper">
        <img class="bottom-right"src="Brook.png" alt="Brook">

    </div>
    
</body>
</html>
